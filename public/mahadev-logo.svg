  <!-- 2. Main Box Outer Frame -->
  <line x1="8" y1="138" x2="190" y2="138" stroke="#0B2240" stroke-width="3.5" />
  <line x1="330" y1="138" x2="512" y2="138" stroke="#0B2240" stroke-width="3.5" />
  <line x1="8" y1="136" x2="8" y2="188" stroke="#0B2240" stroke-width="3.5" />
  <line x1="512" y1="136" x2="512" y2="188" stroke="#0B2240" stroke-width="3.5" />
